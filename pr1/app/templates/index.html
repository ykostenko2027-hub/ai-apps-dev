<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { min-height: 3rem; white-space: pre-wrap; margin-top: 1rem; padding: 1rem; border-radius: 6px; background-color: #f5f5f5; }
    .error { color: #b00020; background-color: #fde8e8 !important; }
    .weather-card h2 { margin-top: 0; font-size: 1.25rem; }
    .weather-info { margin: 0.5rem 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>Погода</h1>

  <form id="weather-form">
    <input id="city" name="city" placeholder="Назва міста" autocomplete="off" required>
    <button type="submit">Показати</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('weather-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const city = document.getElementById('city').value.trim();
      if (!city) return;

      result.className = '';
      result.textContent = 'Запит…';

      try {
        const response = await fetch('/api/weather?city=' + encodeURIComponent(city));
        const data = await response.json();

        if (!response.ok) {
          result.className = 'error';
          result.textContent = data.detail || 'Помилка отримання даних';
          return;
        }

        let locationText = data.city;
        if (data.country) {
          locationText += `, ${data.country}`;
        }

        result.innerHTML = `
          <div class="weather-card">
            <h2>${locationText}</h2>
            <div class="weather-info"><strong>Температура:</strong> ${data.temperature} ${data.temperature_unit}</div>
            <div class="weather-info"><strong>Швидкість вітру:</strong> ${data.wind_speed} ${data.wind_speed_unit}</div>
          </div>
        `;
      } catch (error) {
        result.className = 'error';
        result.textContent = 'Не вдалося звернутися до сервера.';
      }
    });
  </script>
</body>
</html>
